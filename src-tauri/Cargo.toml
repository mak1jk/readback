[package]
name = "readback"
version = "0.1.0"
description = "Browse local coding-agent session logs"
license = "MIT"
authors = ["mak1jk"]
edition = "2021"

[lib]
name = "readback_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
walkdir = "2"
rayon = "1"

# Keep `tauri dev` usable on multi-GB session folders: optimize dependencies (serde_json etc.).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
